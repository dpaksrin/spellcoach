<!doctype html>
<html lang="en" data-mode="day" data-theme="city">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SpellCoach">
<meta name="theme-color" content="#0055BF">
<title>SpellCoach</title>
<style>
:root{--font:ui-rounded,"SF Pro Rounded","Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,sans-serif;--main:#0055BF;--main-text:#fff;--accent:#F2CD37;--accent-text:#1B2A34;--gold:#F5C518}
[data-mode=day]{--bg:#EAF1FB;--bg2:#D3E2F7;--surface:#fff;--surface2:#EEF2F8;--text:#1B2A34;--muted:#5D6B7A;--line:rgba(27,42,52,.09);--shadow:0 12px 32px rgba(27,42,52,.12);--empty:#CBD3DD;--empty-text:#5D6B7A}
[data-mode=night]{--bg:#0B1222;--bg2:#18233F;--surface:#18213A;--surface2:#232E4B;--text:#F1F5FB;--muted:#9FB0C8;--line:rgba(255,255,255,.08);--shadow:0 12px 34px rgba(0,0,0,.45);--empty:#2C3858;--empty-text:#9FB0C8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--text);background:radial-gradient(1400px 700px at 50% -15%,var(--bg2),var(--bg)) fixed;background-color:var(--bg);-webkit-tap-highlight-color:transparent;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
h1,h2,h3{margin:0;font-weight:900;letter-spacing:-.3px}
#scenery{position:fixed;left:0;right:0;bottom:0;height:46vh;pointer-events:none;z-index:0;opacity:.6}
#scenery svg{width:100%;height:100%;display:block}
.sc1{fill:var(--scene1)}.sc2{fill:var(--scene2)}.sc3{fill:var(--scene3)}.sc4{fill:var(--scene4)}.scw{fill:var(--scenew)}
#app{position:relative;z-index:1;min-height:100vh;padding-bottom:120px}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px}
/* header */
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px}
.logo .lb{display:flex;gap:3px}
.logo .lb i{width:14px;height:20px;border-radius:3px;display:block;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.chips{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:900;font-size:15px;box-shadow:0 3px 10px rgba(0,0,0,.06);white-space:nowrap}
.chip.btn{cursor:pointer}
.chip.warn{background:#FE8A18;color:#fff;border-color:transparent}
.chip.err{background:#D01012;color:#fff;border-color:transparent}
.chip.good .dot{background:#00A64A}
.dot{width:9px;height:9px;border-radius:50%;background:#7a8899;display:inline-block}
.stud{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#FFE680,#F2CD37 55%,#C9A100);box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);display:inline-block}
/* bricks */
.brick{--c:var(--main);--ct:var(--main-text);position:relative;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--c);color:var(--ct);border:0;border-radius:12px;padding:16px 22px 14px;margin-top:8px;font:900 19px/1.15 var(--font);cursor:pointer;box-shadow:inset 0 -6px 0 rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.28),0 8px 18px rgba(0,0,0,.16);transition:transform .08s,box-shadow .08s,filter .15s;user-select:none;-webkit-user-select:none;text-align:center}
.brick::before{content:"";position:absolute;left:12px;right:12px;top:-7px;height:8px;background:radial-gradient(ellipse 8px 7px at 50% 100%,var(--c) 96%,transparent 100%) center 0/28px 8px repeat-x;filter:brightness(1.07)}
.brick:hover{filter:brightness(1.06)}
.brick:active{transform:translateY(4px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.22),0 3px 8px rgba(0,0,0,.16)}
.brick.accent{--c:var(--accent);--ct:var(--accent-text)}
.brick.ghost{--c:var(--surface2);--ct:var(--text)}
.brick.gold{--c:var(--gold);--ct:#3A2A00}
.brick.red{--c:#D01012;--ct:#fff}
.brick.big{font-size:23px;padding:22px 26px 20px;width:100%}
.brick.sm{font-size:15px;padding:10px 14px 9px;border-radius:10px}
.brick.sm::before{left:8px;right:8px;top:-6px;height:7px;background-size:22px 7px}
.brick:disabled{opacity:.45;cursor:default;transform:none}
.linkbtn{background:none;border:0;color:var(--muted);font:800 15px var(--font);text-decoration:underline;cursor:pointer;padding:8px}
/* cards */
.card{background:var(--surface);border-radius:26px;box-shadow:var(--shadow);padding:22px;border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.stack-gap>*+*{margin-top:18px}
.section-title{display:flex;align-items:center;gap:10px;margin:30px 0 14px;font-size:22px}
.muted{color:var(--muted)}
.eyebrow{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.big-num{font-size:44px;font-weight:900;line-height:1}
.bar{height:22px;border-radius:12px;background:var(--surface2);overflow:hidden;box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}
.bar>i{display:block;height:100%;min-width:0;border-radius:12px;background:repeating-linear-gradient(90deg,var(--accent) 0 24px,color-mix(in srgb,var(--accent) 78%,#000) 24px 26px);transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.sm{height:12px}
/* hero */
.hero{display:flex;align-items:center;gap:22px;margin-top:22px;overflow:hidden;position:relative;background:linear-gradient(135deg,var(--main),color-mix(in srgb,var(--main) 60%,#000));color:var(--main-text);border:0}
.hero .fig{flex:none;filter:drop-shadow(0 10px 14px rgba(0,0,0,.3))}
.hero h1{font-size:34px}
.hero p{margin:6px 0 0;font-size:18px;font-weight:700;opacity:.92}
.bubble{display:inline-block;background:rgba(255,255,255,.18);border-radius:16px;padding:8px 14px;font-weight:800;margin-top:12px}
.goalbricks{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.goalbricks i{width:54px;height:30px;border-radius:7px;position:relative;background:rgba(255,255,255,.18);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15);display:block}
.goalbricks i::before{content:"";position:absolute;left:7px;right:7px;top:-6px;height:7px;background:radial-gradient(ellipse 7px 6px at 50% 100%,rgba(255,255,255,.18) 96%,transparent 100%) 0 0/20px 7px repeat-x}
.goalbricks i.on{background:var(--accent);box-shadow:inset 0 -4px 0 rgba(0,0,0,.22),0 4px 10px rgba(0,0,0,.25);animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
.goalbricks i.on::before{background-image:radial-gradient(ellipse 7px 6px at 50% 100%,var(--accent) 96%,transparent 100%)}
.countdown{display:inline-flex;gap:8px;align-items:center;background:var(--accent);color:var(--accent-text);border-radius:14px;padding:8px 14px;font-weight:900;margin-top:12px;margin-left:8px}
/* missions */
.mission{display:flex;align-items:center;gap:16px;padding:16px 18px}
.mission+.mission{margin-top:14px}
.zicon{width:58px;height:58px;flex:none;border-radius:16px;display:grid;place-items:center;font-size:30px;background:var(--surface2);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.mission .t{font-size:20px;font-weight:900}
.mission .s{font-size:14px;color:var(--muted);font-weight:700;margin-top:2px}
.mission .go{margin-left:auto;flex:none}
.done-tag{margin-left:auto;font-weight:900;color:#00852B;font-size:17px;display:flex;align-items:center;gap:6px}
.statsrow{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px}
.statsrow div{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px}
.mk{width:16px;height:12px;border-radius:3px;display:inline-block;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.mk.studied{background:color-mix(in srgb,var(--main) 45%,var(--surface2))}.mk.passed{background:var(--main)}.mk.gold{background:var(--gold)}.mk.none{background:var(--empty)}
/* map */
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.zone{text-align:left;cursor:pointer;color:var(--text);display:flex;flex-direction:column;gap:10px;transition:transform .15s,box-shadow .15s;font-family:inherit}
.zone:hover{transform:translateY(-3px)}
.zone:active{transform:translateY(1px)}
.zone .zn{font-size:20px;font-weight:900}
.zone .zs{font-size:13px;color:var(--muted);font-weight:700;margin-top:-6px}
.zone .zm{display:flex;justify-content:space-between;font-weight:800;font-size:14px;color:var(--muted)}
.zone.complete{outline:3px solid var(--gold)}
/* zone screen */
.backrow{display:flex;align-items:center;gap:14px;margin-top:22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:24px 16px;margin-top:22px}
.tile{--c:var(--empty);--ct:var(--empty-text);flex-direction:column;align-items:flex-start;justify-content:flex-start;min-height:100px;padding:14px 14px 12px;text-align:left;width:100%;margin-top:0}
.tile .n{font-size:12px;font-weight:900;opacity:.75;letter-spacing:.5px}
.tile .l{font-size:18px;font-weight:900;margin-top:2px;word-break:break-word}
.tile .marks{display:flex;gap:4px;margin-top:auto;padding-top:10px}
.tile .marks i{width:16px;height:10px;border-radius:3px;background:rgba(0,0,0,.15);display:block}
.tile .marks i.on{background:rgba(255,255,255,.9)}
.tile.studied{--c:color-mix(in srgb,var(--main) 45%,var(--surface2));--ct:var(--text)}
.tile.studied .marks i.on{background:var(--main)}
.tile.passed{--c:var(--main);--ct:var(--main-text)}
.tile.gold{--c:var(--gold);--ct:#3A2A00;background-image:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.45) 45%,transparent 60%);background-size:300% 100%;animation:shine 3.5s infinite}
.tile.gold .marks i.on{background:#3A2A00}
.tile.today{outline:3px dashed var(--accent);outline-offset:3px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-weight:800;font-size:14px;color:var(--muted);margin-top:14px}
.legend span{display:flex;align-items:center;gap:6px}
/* nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
nav.bottom button{flex:1;max-width:140px;background:none;border:0;color:var(--muted);font:900 13px var(--font);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 7px;border-radius:14px;cursor:pointer}
nav.bottom .ico{font-size:25px;line-height:1.1}
nav.bottom button.on{background:var(--main);color:var(--main-text);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2),0 0 0 2px var(--accent)}
/* modal */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(6,10,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--surface);color:var(--text);width:min(640px,100%);max-height:94vh;overflow:auto;border-radius:30px 30px 0 0;padding:26px 22px calc(26px + env(safe-area-inset-bottom));animation:up .32s cubic-bezier(.2,.9,.3,1.15);position:relative}
@media (min-width:720px){.overlay{align-items:center}.sheet{border-radius:30px;padding:30px}}
.sheet-head{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.sheet-head h2{font-size:28px}
.x{margin-left:auto;align-self:flex-start;width:44px;height:44px;border-radius:50%;border:0;background:var(--surface2);color:var(--text);font-size:22px;font-weight:900;cursor:pointer;flex:none}
.ladder{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.step{background:var(--surface2);border-radius:18px;padding:14px 10px;text-align:center}
.step .si{width:46px;height:30px;margin:6px auto 8px;border-radius:7px;background:var(--empty);box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.step.on .si{background:var(--main)}
.step.on.g .si{background:var(--gold)}
.step .sl{font-weight:900;font-size:15px}
.step .sd{font-size:13px;color:var(--muted);font-weight:700;margin-top:3px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
@media (max-width:460px){.actions{grid-template-columns:1fr}}
.callout{border-radius:18px;padding:14px 16px;font-weight:800;margin-top:16px;background:color-mix(in srgb,var(--gold) 22%,var(--surface));border:2px solid color-mix(in srgb,var(--gold) 60%,transparent)}
.callout.info{background:color-mix(in srgb,var(--main) 12%,var(--surface));border-color:color-mix(in srgb,var(--main) 35%,transparent)}
.callout.warn{background:color-mix(in srgb,#FE8A18 16%,var(--surface));border-color:color-mix(in srgb,#FE8A18 50%,transparent)}
.hist{margin-top:20px;font-size:15px}
.hist summary{cursor:pointer;font-weight:900;color:var(--muted)}
.hist li{padding:6px 0;font-weight:700}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:10px}
.scores .brick{flex-direction:column;padding:18px 8px 14px;width:100%}
.scores .brick b{font-size:30px}
.scores .brick small{font-size:13px;opacity:.85}
@media (max-width:460px){.scores{grid-template-columns:repeat(2,1fr)}}
/* celebrate */
.celebrate{text-align:center}
.celebrate h1{font-size:38px;margin-top:6px;background:linear-gradient(90deg,var(--main),var(--accent));-webkit-background-clip:text;background-clip:text;color:transparent;filter:saturate(1.2)}
[data-mode=night] .celebrate h1{background:linear-gradient(90deg,#fff,var(--accent));-webkit-background-clip:text;background-clip:text}
.celebrate .fig{animation:jump .7s cubic-bezier(.3,1.6,.5,1) .1s both}
.bstack{display:flex;flex-direction:column-reverse;align-items:center;height:110px;justify-content:flex-start;margin:6px 0}
.bstack i{display:block;width:96px;height:30px;border-radius:7px;margin-top:-2px;position:relative;background:var(--c);box-shadow:inset 0 -5px 0 rgba(0,0,0,.22);animation:drop .55s cubic-bezier(.3,1.5,.5,1) both}
.bstack i::before{content:"";position:absolute;left:9px;right:9px;top:-6px;height:7px;background:radial-gradient(ellipse 7px 6px at 50% 100%,var(--c) 96%,transparent 100%) 0 0/26px 7px repeat-x}
.reward{display:inline-flex;align-items:center;gap:8px;font-size:22px;font-weight:900;background:var(--surface2);border-radius:999px;padding:10px 18px;margin:12px 4px 0;animation:pop .5s cubic-bezier(.3,1.6,.5,1) .5s both}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-24px;width:16px;height:10px;border-radius:3px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);animation:fall linear forwards}
/* toast */
.toast{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);z-index:50;background:#1B2A34;color:#fff;border-radius:16px;padding:12px 16px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;gap:12px;align-items:center;animation:up .25s;max-width:92vw}
.toast button{background:var(--accent);color:var(--accent-text);border:0;border-radius:10px;padding:8px 12px;font:900 14px var(--font);cursor:pointer}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}
.cal .dow{text-align:center;font-size:13px;font-weight:900;color:var(--muted)}
.cal button{aspect-ratio:1/1;border:0;border-radius:14px;background:var(--surface2);color:var(--text);font:900 16px var(--font);cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:2px}
.cal button.has{background:var(--main);color:var(--main-text);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.cal button.goal::after{content:"★";position:absolute;top:3px;right:6px;font-size:12px;color:var(--accent)}
.cal button.today{outline:3px solid var(--accent);outline-offset:1px}
.cal button.sel{transform:scale(1.06);box-shadow:0 6px 16px rgba(0,0,0,.25)}
.cal button small{font-size:11px;font-weight:800;opacity:.9}
.cal .blank{visibility:hidden}
.calhead{display:flex;align-items:center;gap:10px}
.calhead h2{flex:1;text-align:center;font-size:24px}
.daylist li{padding:10px 0;border-bottom:1px solid var(--line);font-weight:700;display:flex;gap:10px;align-items:center}
.daylist ul{list-style:none;padding:0;margin:0}
/* style */
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.themecard{cursor:pointer;border:3px solid transparent;text-align:center;color:var(--text);font-family:inherit;position:relative;overflow:hidden;padding:18px 14px}
.themecard.on{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 30%,transparent),var(--shadow)}
.themecard .tn{font-size:20px;font-weight:900;margin-top:6px}
.themecard .tt{font-size:14px;color:var(--muted);font-weight:700}
.themecard .on-tag{position:absolute;top:12px;right:12px;background:var(--main);color:var(--main-text);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:900}
.swatches{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
.sw{width:58px;height:44px;border-radius:10px;border:0;cursor:pointer;position:relative;background:var(--c);box-shadow:inset 0 -5px 0 rgba(0,0,0,.22),0 4px 10px rgba(0,0,0,.12);margin-top:8px}
.sw::before{content:"";position:absolute;left:6px;right:6px;top:-6px;height:7px;background:radial-gradient(ellipse 7px 6px at 50% 100%,var(--c) 96%,transparent 100%) 0 0/23px 7px repeat-x}
.sw.on{outline:4px solid var(--text);outline-offset:3px}
.sw span{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;color:var(--t);font-size:20px}
.seg{display:inline-flex;background:var(--surface2);border-radius:16px;padding:5px;gap:5px;margin-top:8px}
.seg button{border:0;background:none;color:var(--text);font:900 17px var(--font);padding:12px 20px;border-radius:12px;cursor:pointer}
.seg button.on{background:var(--main);color:var(--main-text);box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
.field{display:block;margin-top:16px;font-weight:900}
.field input,.field select{display:block;width:100%;margin-top:8px;font:800 18px var(--font);padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface2);color:var(--text)}
.field small{font-weight:700;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:14px;margin-top:8px}
.stepper b{font-size:28px;min-width:40px;text-align:center}
.savebar{position:sticky;bottom:96px;z-index:4;display:flex;gap:12px;justify-content:center;margin-top:24px}
/* parent */
.ptable{width:100%;border-collapse:collapse;font-size:15px}
.ptable td,.ptable th{padding:9px 6px;border-bottom:1px solid var(--line);text-align:left}
.ptable th{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.ver{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ver .vt{font-weight:900}
.ver .vs{font-size:13px;color:var(--muted);font-weight:700}
.ver .brick{margin-left:auto;flex:none}
.vnum{width:34px;height:34px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-weight:900;flex:none}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.editbox{margin-top:20px;border:2px dashed var(--line);border-radius:18px;padding:14px}
.editrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0}
.editrow input{font:800 15px var(--font);padding:8px;border-radius:10px;border:2px solid var(--line);background:var(--surface2);color:var(--text)}
.editrow input[type=number]{width:80px}
/* pin */
.pindots{display:flex;gap:14px;justify-content:center;margin:18px 0}
.pindots i{width:22px;height:22px;border-radius:50%;background:var(--surface2);display:block;box-shadow:inset 0 2px 4px rgba(0,0,0,.15)}
.pindots i.on{background:var(--main)}
.pinpad{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 12px;max-width:340px;margin:0 auto}
.pinpad .brick{width:100%;font-size:26px}
.shake{animation:shake .4s}
/* choice */
.choices{display:grid;gap:14px}
.choice{text-align:left;cursor:pointer;color:var(--text);font-family:inherit;border:2px solid var(--line)}

<script>
'use strict';
/* ================= constants ================= */
const APP_VERSION = '1.0.0';
const SCHEMA_VERSION = 1;
const MAX_VERSIONS = 10;

const THEMES = {
  city:{name:'Brick City', tag:'Build the coolest city ever', hero:'Builder', done:'Snap! Build complete!', gold:'GOLD BRICK! Master build!',
        groups:{missions:'HQ Missions', lists:'Neighborhoods', special:'Special Builds', compete:'Champion Zones'}, mapTitle:'City Map', champion:'Champion Tower'},

  diving:{name:'Deep Sea Dive', tag:'Dive deep for treasure words', hero:'Diver', done:'Splash! Dive complete!', gold:'GOLD BRICK! Sunken treasure!',

const ZONE_DEFS = [
  {id:'hq2026', match:/^2026 spelling words$/, group:'missions', order:1, short:'2026 Spelling Words', names:{city:'City Hall',space:'Mission Control',castle:'Royal Court',chess:"King's Court",diving:'Dive Base'}, icons:{city:'🏛️',space:'🛰️',castle:'👑',chess:'♔',diving:'⚓'}},
  {id:'custom', match:/^custom$/, group:'missions', order:2, short:'Custom Sets', names:{city:'Secret Workshop',space:'Secret Hangar',castle:'Wizard Tower',chess:'Secret Gambit',diving:"Neptune's Grotto"}, icons:{city:'🛠️',space:'🚀',castle:'🧙',chess:'♞',diving:'🔱'}},
  {id:'coach', match:/^intermediate coaching$/, group:'missions', order:3, short:'Intermediate Coaching', names:{city:'Coach HQ',space:'Training Pod',castle:'Training Yard',chess:'Practice Board',diving:'Training Lagoon'}, icons:{city:'📋',space:'🧑‍🚀',castle:'⚔️',chess:'♟️',diving:'🤿'}},
  {id:'popular', match:/^popular national words$/, group:'special', order:200, short:'Popular National Words', names:{city:'Race Track',space:'Asteroid Belt',castle:'Battle Plains',chess:'Blitz Arena',diving:'Dolphin Bay'}, icons:{city:'🏁',space:'☄️',castle:'🛡️',chess:'⏱️',diving:'🐬'}},
  {id:'geo', match:/^geographical words module$/, group:'special', order:201, short:'Geographical Words', names:{city:'Harbor',space:'Planet Explorer',castle:"Explorer's Isles",chess:'World Openings',diving:'Coral Islands'}, icons:{city:'⚓',space:'🌍',castle:'🏝️',chess:'🌍',diving:'🏝️'}},
  {id:'sci', match:/^scientific words module$/, group:'special', order:202, short:'Scientific Words', names:{city:'Science Lab',space:'Rocket Lab',castle:'Alchemist Lab',chess:'Strategy Lab',diving:'Ocean Lab'}, icons:{city:'🧪',space:'🔬',castle:'⚗️',chess:'🧠',diving:'🔬'}},
  {id:'roots', match:/^roots$/, group:'special', order:203, short:'Word Roots', names:{city:'City Museum',space:'Moon Ruins',castle:'Ancient Ruins',chess:'Ancient Masters',diving:'Sunken Ruins'}, icons:{city:'🏺',space:'🌙',castle:'🏺',chess:'📜',diving:'🏺'}},
  {id:'master', match:/^masterspellingwords$/, group:'special', order:204, short:'Master Spelling Words', names:{city:'Mega Mall',space:'Star Base',castle:'Great Hall',chess:'Grand Library',diving:'Treasure Cave'}, icons:{city:'🏬',space:'⭐',castle:'🏰',chess:'📚',diving:'💎'}},
  {id:'school', match:/^past scripps school words$/, group:'compete', order:300, short:'Past Scripps School', names:{city:'School Campus',space:'Cadet Academy',castle:'Training Grounds',chess:'School Tournament',diving:'Shallow Waters'}, icons:{city:'🏫',space:'🎓',castle:'🎯',chess:'♙',diving:'🐚'}},
  {id:'district', match:/^past scripps district-county spelling words$/, group:'compete', order:301, short:'Past Scripps District-County', names:{city:'Fire Station',space:'Space Station',castle:'Iron Bridge',chess:'County Tournament',diving:'Kelp Forest'}, icons:{city:'🚒',space:'🛰️',castle:'🌉',chess:'♗',diving:'🌿'}},
  {id:'regional', match:/^past scripps regional words$/, group:'compete', order:302, short:'Past Scripps Regional', names:{city:'Police HQ',space:'Moon Base',castle:'Castle Gates',chess:'Regional Tournament',diving:'Shipwreck'}, icons:{city:'🚓',space:'🌕',castle:'🏯',chess:'♖',diving:'🚢'}},
  {id:'sasb', match:/^past sasb finals words$/, group:'compete', order:303, short:'Past SASB Finals', names:{city:'Stadium',space:'Galaxy Arena',castle:'Arena of Champions',chess:'Masters Arena',diving:'Shark Arena'}, icons:{city:'🏟️',space:'🌌',castle:'🏟️',chess:'♕',diving:'🦈'}},
  {id:'national', match:/^past national scripps words/, group:'compete', order:304, short:'Past National Scripps', names:{city:'Skyscraper',space:'Mothership',castle:'Mega Fortress',chess:'Grandmaster Hall',diving:'Deep Trench'}, icons:{city:'🏙️',space:'🛸',castle:'🏰',chess:'🏛️',diving:'🌊'}},
  {id:'snsb', match:/^past snsb words$/, group:'compete', order:305, short:'Past SNSB', names:{city:'Champion Tower',space:'Champion Planet',castle:'Dragon Peak',chess:'World Championship',diving:'Champion Abyss'}, icons:{city:'🏆',space:'🏆',castle:'🐉',chess:'🏆',diving:'🐋'}}
];const GROUP_ORDER = ['missions','lists','special','compete','other'];

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const nowIso = () => new Date().toISOString();
const pad = n => String(n).padStart(2,'0');
const dayKey = d => { const x = new Date(d); return `${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}`; };
const todayKey = () => dayKey(Date.now());
const keyToDate = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const dayNum = k => { const [y,m,d] = k.split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/864e5); };
const addDays = (k,n) => { const d = keyToDate(k); d.setDate(d.getDate()+n); return dayKey(d); };
const fmtDate = iso => new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const fmtShort = iso => new Date(iso).toLocaleDateString(undefined,{month:'short',day:'numeric'});
const fmtTime = iso => new Date(iso).toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
const fmtDT = iso => `${fmtDate(iso)}, ${fmtTime(iso)}`;
const fmtKey = (k,o={weekday:'long',month:'long',day:'numeric'}) => keyToDate(k).toLocaleDateString(undefined,o);
const toLocalInput = iso => { const d = new Date(iso); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const deviceName = () => isIOS() ? 'iPad' : (/Windows/.test(navigator.userAgent) ? 'PC' : (/Mac/.test(navigator.userAgent) ? 'Mac' : 'device'));
const plural = (n,w,p) => `${n} ${n===1?w:(p||w+'s')}`;
function hexToRgb(h){ h=h.replace('#',''); return [0,2,4].map(i=>parseInt(h.substr(i,2),16)); }
function rgbToHex(r){ return '#'+r.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join(''); }
function mix(a,b,t){ const A=hexToRgb(a),B=hexToRgb(b); return rgbToHex(A.map((v,i)=>v*(1-t)+B[i]*t)); }
function lum(h){ const [r,g,b]=hexToRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}); return .2126*r+.7152*g+.0722*b; }
const textOn = h => lum(h) > .42 ? '#1B2A34' : '#FFFFFF';
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
async function hashPin(pin){
  // Salt predates the rename; changing it would invalidate every saved parent PIN.
  const msg = 'brickquest:' + pin;
  try { const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg)); return 'sha256:' + [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join(''); }
  catch { let h = 5381; for (const c of msg) h = ((h<<5)+h+c.charCodeAt(0))|0; return 'djb2:' + (h>>>0).toString(16); }
}

/* ================= word list catalog ================= */
let SETS = [], ZONES = [], ZONE_BY_ID = {}, SET_BY_NAME = {};
function parseListNames(txt){ return String(txt||'').split(/\r?\n/).map(s=>s.trim()).filter(s=>s && s.toLowerCase() !== 'word list name'); }
function parseSet(name){
  const m = name.match(/^(.*?)(?:_| - )set[_ ](\d+)(?:_(.*))?$/i);
  if (m) return {collection:m[1].trim(), num:+m[2], label:(m[3]||'').trim()};
  if (/\broots(\s+\d+)?$/i.test(name)) return {collection:'Roots', num:0, label:name.replace(/\s+/g,' ').trim()};
  const c = name.match(/^(intermediate coaching)\s*-\s*(.*)$/i);
  if (c) return {collection:c[1], num:0, label:c[2].trim()};
  return {collection:name, num:0, label:name};
}
function zoneDefFor(col){
  const c = col.toLowerCase().replace(/\s+/g,' ').trim();
  const m = c.match(/^spelling word list (\d+)$/);
  if (m){ const n=+m[1]; return {id:'list'+n, group:'lists', order:100+n, short:`Spelling Word List ${n}`, names:{city:`Neighborhood ${n}`,space:`Sector ${n}`,castle:`Village ${n}`,chess:`Chess Club ${n}`,diving:`Reef ${n}`}, icons:{city:'🏘️',space:'🪐',castle:'🏡',chess:'♟️',diving:'🐠'}}; }
  for (const d of ZONE_DEFS) if (d.match.test(c)) return d;
  return {id:'z-'+c.replace(/[^a-z0-9]+/g,'-'), group:'other', order:900, short:col, names:{city:col,space:col,castle:col,chess:col,diving:col}, icons:{city:'📦',space:'📦',castle:'📦',chess:'📦',diving:'📦'}};
}
function buildCatalog(names){
  const seen = new Set(), zm = new Map(); SETS = [];
  for (const raw of names){
    const name = raw.trim(); const k = name.toLowerCase();
    if (!name || seen.has(k)) continue; seen.add(k);
    const p = parseSet(name), def = zoneDefFor(p.collection);
    if (!zm.has(def.id)) zm.set(def.id, {...def, sets:[]});
    const s = {id:SETS.length, name, zoneId:def.id, num:p.num, label:p.label};
    SETS.push(s); zm.get(def.id).sets.push(s);
  }
  ZONES = [...zm.values()].sort((a,b)=> a.order-b.order || a.short.localeCompare(b.short));
  for (const z of ZONES){
    z.sets.sort((a,b)=> (a.num||0)-(b.num||0) || a.id-b.id);
    z.sets.forEach((s,i)=>{ s.pos = i+1; s.display = (!s.label || /^set\s*\d+$/i.test(s.label)) ? `Set ${s.num||i+1}` : s.label; });
  }
  ZONE_BY_ID = Object.fromEntries(ZONES.map(z=>[z.id,z]));
  SET_BY_NAME = Object.fromEntries(SETS.map(s=>[s.name,s]));
}
const theme = () => (S.styleDraft || D().player).theme;
const zoneName = z => z.names[theme()] || z.short;
const zoneIcon = z => z.icons[theme()] || '📦';
const setTitle = s => `${ZONE_BY_ID[s.zoneId].short} · ${s.display}`;

/* ================= data model ================= */
function newData(){
  return {schemaVersion:SCHEMA_VERSION, savedAt:nowIso(), label:'New game', device:deviceName(), appVersion:APP_VERSION,
    player:{name:'', theme:'city', mainColor:'blue', accentColor:'yellow', mode:'day'},
    settings:{dailyGoal:2, beeDate:'', focusZone:'', sound:true, pinHash:''},
    sets:{}};
}
const newDoc = () => ({app:'SpellCoach', schemaVersion:SCHEMA_VERSION, current:newData(), versions:[]});
function normalizeData(x){
  if (!x || typeof x !== 'object' || !x.sets || typeof x.sets !== 'object') throw new Error('Missing progress data');
  const d = newData(); const sets = {};
  for (const [name,r] of Object.entries(x.sets)){
    if (!r || typeof r !== 'object') continue;
    sets[name] = {
      studied:(Array.isArray(r.studied)?r.studied:[]).filter(v=>typeof v==='string' && !isNaN(Date.parse(v))),
      quizzes:(Array.isArray(r.quizzes)?r.quizzes:[]).filter(q=>q && !isNaN(Date.parse(q.date))).map(q=>({date:q.date, score:Math.max(0,Math.min(100,Number(q.score)||0))}))
    };
  }
  const player = {...d.player, ...(x.player||{})};
  if (!THEMES[player.theme]) player.theme = 'city';
  if (!BRICK_COLORS[player.mainColor]) player.mainColor = 'blue';
  if (!BRICK_COLORS[player.accentColor]) player.accentColor = 'yellow';
  if (player.mode !== 'night') player.mode = 'day';
  const settings = {...d.settings, ...(x.settings||{})};
  settings.dailyGoal = Math.max(1, Math.min(10, parseInt(settings.dailyGoal)||2));
  return {...d, ...x, schemaVersion:SCHEMA_VERSION, savedAt: (typeof x.savedAt==='string' && !isNaN(Date.parse(x.savedAt))) ? x.savedAt : d.savedAt, label:String(x.label||'Saved'), player, settings, sets};
}
function normalizeDoc(raw){
  const o = typeof raw === 'string' ? JSON.parse(raw) : raw;
  if (!o || !APP_IDS.includes(o.app) || !o.current) throw new Error('This is not a SpellCoach save file.');
  if ((o.schemaVersion||1) > SCHEMA_VERSION) throw new Error('This save file comes from a newer version of SpellCoach. Please update SpellCoach.html.');
  const versions = (Array.isArray(o.versions)?o.versions:[]).map(v=>{ try { return normalizeData(v); } catch { return null; } }).filter(Boolean).slice(0, MAX_VERSIONS);
  return {app:'SpellCoach', schemaVersion:SCHEMA_VERSION, current:normalizeData(o.current), versions};
}
const isFresh = doc => doc.versions.length === 0 && Object.keys(doc.current.sets).length === 0;

/* ================= progress math ================= */
function passDays(rec){ return (rec?.quizzes||[]).filter(q=>q.score>=PASS_SCORE).map(q=>dayKey(q.date)).sort(); }
function setStatus(rec){
  if (!rec) return 'none';
  const p = passDays(rec);
  if (p.length >= 2 && dayNum(p[p.length-1]) - dayNum(p[0]) >= GOLD_DAYS) return 'gold';
  if (p.length) return 'passed';
  if ((rec.studied||[]).length || (rec.quizzes||[]).length) return 'studied';
  return 'none';
}
function goldDue(rec){ const p = passDays(rec); return p.length ? addDays(p[0], GOLD_DAYS) : null; }
function allEvents(data){
  const ev = [];
  for (const [name,r] of Object.entries(data.sets)){
    r.studied.forEach(d=>ev.push({type:'study', date:d, name}));
    r.quizzes.forEach(q=>ev.push({type:'quiz', date:q.date, score:q.score, name}));
  }
  return ev.sort((a,b)=> a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
}
function computeStats(data){
  const ev = allEvents(data), byDay = {};
  ev.forEach(e=>{ const k = dayKey(e.date); (byDay[k] = byDay[k] || []).push(e); });
  const goal = data.settings.dailyGoal || 2;
  let studs = 0; const goalDays = new Set();
  for (const [k,list] of Object.entries(byDay)){
    // Repeat taps on the same set in one day earn studs only once, so studs reflect real work.
    const studied = new Set(), best = {};
    list.forEach(e=>{ if (e.type==='study') studied.add(e.name); else best[e.name] = Math.max(best[e.name] ?? -1, e.score); });
    studs += studied.size * 10;
    Object.values(best).forEach(s=> studs += 20 + (s >= PASS_SCORE ? 10 : 0));
    if (new Set(list.map(e=>e.name)).size >= goal){ studs += 25; goalDays.add(k); }
  }
  const counts = {none:0, studied:0, passed:0, gold:0}, status = {};
  for (const s of SETS){ const st = setStatus(data.sets[s.name]); status[s.name] = st; counts[st]++; }
  studs += counts.gold * 50;
  const days = new Set(Object.keys(byDay));
  let streak = 0, k = todayKey(); if (!days.has(k)) k = addDays(k,-1);
  while (days.has(k)){ streak++; k = addDays(k,-1); }
  const todaySets = [...new Set((byDay[todayKey()]||[]).map(e=>e.name))];
  return {ev, byDay, goal, goalDays, studs, counts, status, streak, todaySets, total:SETS.length, started:SETS.length - counts.none};
}
function zoneProgress(z, st){ let started=0, gold=0, passed=0; z.sets.forEach(s=>{ const x=st.status[s.name]; if (x!=='none') started++; if (x==='gold') gold++; if (x==='passed'||x==='gold') passed++; }); return {started, gold, passed, total:z.sets.length}; }
function orderedSets(){
  const f = D().settings.focusZone;
  const fz = ZONE_BY_ID[f];
  return [...(fz ? fz.sets : []), ...ZONES.filter(z=>z.id!==f).flatMap(z=>z.sets)];
}
function todayPlan(st){
  const done = st.todaySets.map(n=>SET_BY_NAME[n]).filter(Boolean);
  const doneSet = new Set(done.map(s=>s.name));
  const need = done.length >= st.goal ? 1 : st.goal - done.length;
  const all = orderedSets();
  const finish = all.filter(s=> st.status[s.name]==='studied' && !doneSet.has(s.name)).slice(0, 1);
  const fresh = all.filter(s=> st.status[s.name]==='none' && !doneSet.has(s.name));
  const next = [...finish, ...fresh].slice(0, need);
  const t = todayKey();
  const gold = all.filter(s=> st.status[s.name]==='passed' && !doneSet.has(s.name) && goldDue(D().sets[s.name]) <= t).slice(0, 3);
  return {done, next, gold, bonus: done.length >= st.goal};
}

/* ================= storage ================= */
let idb = null;
// Database name predates the rename; keeping it preserves progress already saved in the browser.
function idbOpen(){ return new Promise((res,rej)=>{ const r = indexedDB.open('brickquest', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function kvGet(k){
  try { idb = idb || await idbOpen(); return await new Promise((res,rej)=>{ const q = idb.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
  catch { try { const v = localStorage.getItem('bq:'+k); return v ? JSON.parse(v) : undefined; } catch { return undefined; } }
}
async function kvSet(k,v){
  try { idb = idb || await idbOpen(); await new Promise((res,rej)=>{ const tx = idb.transaction('kv','readwrite'); tx.objectStore('kv').put(v,k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); }
  catch { try { if (typeof v === 'string' || typeof v === 'object' && !(v instanceof FileSystemHandle)) localStorage.setItem('bq:'+k, JSON.stringify(v)); } catch {} }
}
async function kvDel(k){ try { idb = idb || await idbOpen(); await new Promise(res=>{ const tx = idb.transaction('kv','readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = res; tx.onerror = res; }); } catch {} }

let writeChain = Promise.resolve();
function persist(){
  const json = JSON.stringify(S.doc, null, 2);
  writeChain = writeChain.then(()=>doPersist(json)).catch(e=>{ console.error(e); });
  return writeChain;
}
async function doPersist(json){
  if (S.testMode) { S.save = 'local'; return; }
  await kvSet('doc', json);
  if (S.dir && S.dirStatus === 'granted'){

  } else S.save = 'local';

async function writeFolder(json){
  const fh = await S.dir.getFileHandle(FILE_NAME, {create:true});
  try {
    const old = await (await fh.getFile()).text();
    if (old && old.trim() && old !== json) await writeText(await S.dir.getFileHandle(BAK_NAME, {create:true}), old);
  } catch {}

}
function parseJsonBinId(value){
  let id = String(value || '').trim();
  if (id.startsWith('https://')){
    const url = new URL(id);
    const match = url.origin === 'https://api.jsonbin.io' && !url.search && !url.hash ? url.pathname.match(/^\/v3\/b\/([^/]+)\/?$/) : null;
    if (!match) throw new Error('Enter a JSONBin bin ID or its https://api.jsonbin.io/v3/b/{ID} URL.');
    id = match[1];
  }
  if (!/^[A-Za-z0-9_-]{1,128}$/.test(id)) throw new Error('That JSONBin bin ID is not valid.');
  return id;
}
function normalizeJsonBinDoc(raw){
  const o = typeof raw === 'string' ? JSON.parse(raw) : raw;
  try { return {doc:normalizeDoc(o), recovered:false}; }
  catch (e){
    if (!o || !APP_IDS.includes(o.app) || !o.current || (o.schemaVersion||1) > SCHEMA_VERSION) throw e;
    const versions = [];
    for (const version of Array.isArray(o.versions) ? o.versions : []){
      try { versions.push(normalizeData(version)); } catch {}
    }
    if (!versions.length) throw e;
    return {doc:{app:'SpellCoach', schemaVersion:SCHEMA_VERSION, current:versions[0], versions:versions.slice(1, MAX_VERSIONS + 1)}, recovered:true};
  }
}
async function jsonBinRequest(method, doc){
  const id = parseJsonBinId(S.meta.jsonBinId);
  const options = {method};
  if (doc){ options.headers = {'Content-Type':'application/json'}; options.body = JSON.stringify(normalizeDoc(doc)); }
  const version = method === 'GET' ? '/latest' : '';
  if (method === 'GET') options.cache = 'no-store';
  const response = await fetch(`https://api.jsonbin.io/v3/b/${encodeURIComponent(id)}${version}`, options);
  let payload = null;
  try { payload = await response.json(); } catch {}
  if (!response.ok) throw new Error(payload && payload.message || `JSONBin returned HTTP ${response.status}.`);
  const saved = payload && payload.record || payload;
  if (method === 'GET') return normalizeJsonBinDoc(saved);
  const confirmed = normalizeJsonBinDoc(saved).doc;
  if (confirmed.current.savedAt !== doc.current.savedAt) throw new Error('JSONBin accepted the write but did not confirm the saved progress.');
  return null;
}
function mergeJsonBinDocs(primary, secondary){
  const current = JSON.stringify(primary.current);
  const seen = new Set([current]);
  const versions = [];
  const candidates = [...primary.versions, ...secondary.versions];
  if (!isFresh(secondary)) candidates.push(secondary.current);
  for (const version of candidates){
    const key = JSON.stringify(version);
    if (!seen.has(key)){ seen.add(key); versions.push(version); }
  }
  return {...primary, versions:versions.slice(0, MAX_VERSIONS)};
}
async function syncJsonBin(){
  if (!S.meta.jsonBinId) throw new Error('Connect a JSONBin bin first.');
  S.remoteSyncReady = false;
  try {
    const remoteResult = await jsonBinRequest('GET');
    const remote = remoteResult.doc;
    const local = S.doc;
    let primary;
    if (isFresh(remote) && !isFresh(local)) primary = local;
    else if (isFresh(local) && !isFresh(remote)) primary = remote;
    else primary = Date.parse(remote.current.savedAt) > Date.parse(local.current.savedAt) ? remote : local;
    const merged = mergeJsonBinDocs(primary, primary === remote ? local : remote);
    const changed = remoteResult.recovered || JSON.stringify(merged) !== JSON.stringify(remote);
    S.doc = merged;
    applyTheme(D().player);
    await kvSet('doc', JSON.stringify(S.doc));
    S.remoteSyncReady = true;
    delete S.meta.jsonBinError;
    await kvSet('meta', S.meta);
    if (changed) await persist();
    if (S.meta.jsonBinError) throw new Error(S.meta.jsonBinError);
    return remoteResult.recovered;
  } catch (e){
    S.remoteSyncReady = false;
    S.meta.jsonBinError = e.message;
    await kvSet('meta', S.meta);
    throw e;
  }
}

async function commit(label, mutate){
  const prev = clone(S.doc.current);
  const next = clone(prev);
  mutate(next);
  next.savedAt = nowIso(); next.label = label; next.device = deviceName(); next.appVersion = APP_VERSION;
  S.doc.versions.unshift(prev);
  S.doc.versions = S.doc.versions.slice(0, MAX_VERSIONS);
  S.doc.current = next;
  await persist();
}
async function restoreVersion(i, label){

let actx = null;
function sfx(kind){
  if (!D().settings.sound || S.testMode) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    const tone = (f, at, dur, type='triangle', vol=.12) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t+at); g.gain.setValueAtTime(vol, t+at); g.gain.exponentialRampToValueAtTime(.0001, t+at+dur); o.connect(g).connect(actx.destination); o.start(t+at); o.stop(t+at+dur+.02); };
    if (kind === 'tap') tone(700, 0, .05, 'square', .04);
    if (kind === 'snap'){ tone(1900, 0, .03, 'square', .08); tone(950, .035, .05, 'square', .07); }
    if (kind === 'win'){ [523,659,784,1047].forEach((f,i)=>tone(f, .08+i*.09, .22, 'triangle', .13)); tone(1568, .5, .35, 'sine', .08); }
    if (kind === 'gold'){ [784,988,1175,1568,1976].forEach((f,i)=>tone(f, i*.08, .3, 'triangle', .12)); }
    if (kind === 'oops') tone(220, 0, .2, 'sawtooth', .05);
  } catch {}
}

function toast(msg, undo){
  let t = $('#toast'); if (t) t.remove();

function render(){
  const st = computeStats(D());
  let body = '';
  if (S.screen === 'today') body = viewToday(st);
  else if (S.screen === 'map') body = viewMap(st);
  else if (S.screen === 'zone') body = viewZone(st);
  else if (S.screen === 'calendar') body = viewCalendar(st);
  else if (S.screen === 'style') body = viewStyle();
  else if (S.screen === 'parents') body = S.parentOk ? viewParents(st) : viewToday(st);
  const focusId = document.activeElement && document.activeElement.id;
  $('#app').innerHTML = header(st) + `<main>${body}</main>` + nav() + modalHTML(st);
  if (focusId === 'pname'){ const el = $('#pname'); if (el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } }
}
function go(screen){
  if (S.screen === 'style' && screen !== 'style' && S.styleDraft){ S.styleDraft = null; applyTheme(D().player); }
  S.screen = screen; S.modal = null; render(); window.scrollTo({top:0});
}

/* ================= actions ================= */
const ACT = {
  nav(d){ sfx('tap'); if (d.to === 'parents' && !S.parentOk){ S.pin=''; S.pinFirst=''; openModal({type:'pin'}); return; } go(d.to); },
  zone(d){ sfx('tap'); S.zoneId = d.id; go('zone'); },
  openSet(d){ sfx('tap'); openModal({type:'set', id:+d.id}); },
  close(){ closeModal(); },
  backdrop(d, el, e){ if (e.target === el && S.modal && S.modal.type !== 'celebrate') closeModal(); },
  study(d){ markStudied(SETS[+d.id].name); },
  quiz(d){ sfx('tap'); openModal({type:'quiz', id:+d.id}); },
  score(d){ markQuiz(SETS[+d.id].name, +d.v); },
  undo(){ const t = $('#toast'); if (t) t.remove(); sfx('oops'); undoLast(); },
  calMove(d){ let [y,m] = S.cal; m += +d.d; if (m < 0){ m = 11; y--; } if (m > 11){ m = 0; y++; } S.cal = [y,m]; S.calDay = null; render(); },
  calDay(d){ sfx('tap'); S.calDay = S.calDay === d.k ? null : d.k; render(); },
  styleSet(d){ sfx('snap'); S.styleDraft[d.f] = d.v; applyTheme(S.styleDraft); render(); },
  styleReset(){ S.styleDraft = clone(D().player); applyTheme(D().player); render(); },
  async styleSave(){ const p = clone(S.styleDraft); await commit(`Changed style to ${THEMES[p.theme].name}`, d=>{ d.player = p; }); S.styleDraft = clone(D().player); applyTheme(D().player); sfx('win'); confetti(50); render(); toast('Style saved. Looking awesome!'); },
  pinKey(d){ pinKey(d.k); },
  lock(){ S.parentOk = false; S.editMode = false; go('today'); },
  connect(){ connectFolder(); },
  reconnect(){ reconnect(); },
  disconnect(){ openModal({type:'confirm', title:'Disconnect the save folder?', body:'Progress will keep saving inside this browser, but not to the JSON file.', yes:'Disconnect', danger:true, onYes:disconnectFolder}); },
  async jsonBinConnect(){
    try {
      S.meta.jsonBinId = parseJsonBinId($('#jsonbin-id').value);
      S.remoteSyncReady = false;
      delete S.meta.jsonBinError;
      await kvSet('meta', S.meta);
      const recovered = await syncJsonBin();
      toast(recovered ? 'Recovered progress from an earlier JSONBin save and repaired the bin.' : 'JSONBin connected and synced');
    } catch (e){ console.error(e); toast(`Could not connect to JSONBin: ${e.message}`); }
    render();
  },
  async jsonBinSync(){
    try {
      const recovered = await syncJsonBin();
      toast(recovered ? 'Recovered progress from an earlier JSONBin save and repaired the bin.' : 'JSONBin sync complete');
    }
    catch (e){ console.error(e); toast(`JSONBin sync failed: ${e.message}`); }
    render();
  },
  async jsonBinDisconnect(){
    S.remoteSyncReady = false;
    delete S.meta.jsonBinId;
    delete S.meta.jsonBinError;
    await kvSet('meta', S.meta);
    render(); toast('JSONBin disconnected. Progress remains on this device.');
  },
  export(){ exportFile(); },
  import(){ $('#filepick').value = ''; $('#filepick').click(); },
  restore(d){ const v = S.doc.versions[+d.i]; openModal({type:'confirm', title:'Restore this version?', body:`<b>${esc(v.label)}</b><br>${esc(fmtDT(v.savedAt))}<br><br>Your current progress will be saved as a version first, so you can undo this.`, yes:'Restore', onYes:async()=>{ await restoreVersion(+d.i); render(); toast('Version restored'); }}); },
  goalStep(d){ const el = $('#goalval'); el.textContent = Math.max(1, Math.min(10, (+el.textContent) + (+d.d))); },
  async saveSettings(){
    const goal = +$('#goalval').textContent, bee = $('#beedate').value, focus = $('#focus').value, sound = $('#sound').checked;
    await commit('Parent changed settings', d=>{ Object.assign(d.settings, {dailyGoal:goal, beeDate:bee, focusZone:focus, sound}); });
    render(); toast('Settings saved');
  },
  changePin(){ S.pin=''; S.pinFirst=''; openModal({type:'pin', mode:'change'}); },
  editToggle(){ S.editMode = !S.editMode; render(); },
  csv(){ exportCSV(); },
  async confirmYes(){ const m = S.modal; S.modal = null; render(); if (m && m.onYes) await m.onYes(); },
  async choose(d){
    const f = S.pendingFileDoc; S.pendingFileDoc = null; S.modal = null;
    if (d.v === 'file') await adoptDoc(f, 'Loaded save file from folder');
    else { S.doc.versions = [clone(f.current), ...S.doc.versions].slice(0, MAX_VERSIONS); await commit('Kept this device progress', ()=>{}); }
    render(); toast('Connected! Progress now saves to the folder.');
  },
  async entryDel(d){ const s = SETS[+d.id]; await commit(`Parent removed an entry from ${setTitle(s)}`, x=>{ const r = rec(x, s.name); (d.type==='study' ? r.studied : r.quizzes).splice(+d.i, 1); }); render(); },
  async entryAdd(d){
    const s = SETS[+d.id], type = $('#addtype').value, dt = $('#adddate').value, score = Math.max(0, Math.min(100, +$('#addscore').value || 0));
    if (!dt) return toast('Pick a date first');
    const iso = new Date(dt).toISOString();
    await commit(`Parent added ${type==='study'?'study':'quiz'} entry to ${setTitle(s)}`, x=>{ const r = rec(x, s.name); if (type==='study') r.studied.push(iso); else r.quizzes.push({date:iso, score}); });
    render(); toast('Entry added');
  },
  async bulkStudy(d){
    const z = ZONE_BY_ID[d.id], k = $('#bulkdate').value; if (!k) return;
    const iso = new Date(keyToDate(k).setHours(12)).toISOString();
    const todo = z.sets.filter(s=> setStatus(D().sets[s.name]) === 'none');
    if (!todo.length) return toast('Every set in this zone is already started');
    openModal({type:'confirm', title:`Mark ${plural(todo.length,'set')} as studied?`, body:`All not-started sets in <b>${esc(z.short)}</b> will be marked studied on <b>${esc(fmtKey(k))}</b>.`, yes:'Mark them', onYes:async()=>{ await commit(`Parent marked ${z.short} studied`, x=>{ todo.forEach(s=>rec(x,s.name).studied.push(iso)); }); render(); toast('Done!'); }});
  }
};
const CHG = {
  async entryDate(el){ const s = SETS[+el.dataset.id]; if (!el.value) return; const iso = new Date(el.value).toISOString();
    await commit(`Parent edited a date on ${setTitle(s)}`, x=>{ const r = rec(x, s.name); if (el.dataset.type==='study') r.studied[+el.dataset.i] = iso; else r.quizzes[+el.dataset.i].date = iso; }); render(); },
  async entryScore(el){ const s = SETS[+el.dataset.id]; const v = Math.max(0, Math.min(100, +el.value || 0));
    await commit(`Parent edited a score on ${setTitle(s)}`, x=>{ rec(x, s.name).quizzes[+el.dataset.i].score = v; }); render(); }

async function pinKey(k){
  const m = S.modal; if (!m) return;
  m.error = '';
  if (k === 'del'){ S.pin = S.pin.slice(0,-1); render(); return; }
  if (S.pin.length >= 4) return;
  sfx('tap'); S.pin += k; render();
  if (S.pin.length < 4) return;
  const creating = !D().settings.pinHash || m.mode === 'change';
  if (creating){
    if (!S.pinFirst){ S.pinFirst = S.pin; S.pin = ''; setTimeout(render, 150); return; }
    if (S.pinFirst !== S.pin){ S.pinFirst = ''; S.pin = ''; m.error = "Those PINs didn't match. Try again."; sfx('oops'); render(); return; }
    const h = await hashPin(S.pin); S.pin = ''; S.pinFirst = '';
    await commit(m.mode === 'change' ? 'Parent changed the PIN' : 'Parent PIN created', d=>{ d.settings.pinHash = h; });
    S.parentOk = true; S.modal = null; go('parents'); toast('PIN saved'); return;
  }
  const h = await hashPin(S.pin); S.pin = '';
  if (h === D().settings.pinHash){ S.parentOk = true; S.modal = null; go('parents'); }
  else { m.error = 'Wrong PIN'; sfx('oops'); render(); }
}
function exportCSV(){
  const st = computeStats(D());
  const q = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const rows = [['Collection','Set','Status','First studied','Times studied','Quizzes','Best score','Last quiz','Gold due/earned']];
  for (const z of ZONES) for (const s of z.sets){
    const r = D().sets[s.name] || {studied:[], quizzes:[]}, status = st.status[s.name];
    const best = r.quizzes.length ? Math.max(...r.quizzes.map(x=>x.score)) : '';
    const last = r.quizzes.length ? r.quizzes.map(x=>x.date).sort().pop() : '';
    rows.push([z.short, s.name, status, r.studied.length ? dayKey([...r.studied].sort()[0]) : '', r.studied.length, r.quizzes.length, best, last ? dayKey(last) : '', status==='gold' ? 'earned' : (goldDue(r) || '')]);
  }
  downloadText(`spellcoach-report-${todayKey()}.csv`, rows.map(r=>r.map(q).join(',')).join('\r\n'), 'text/csv');
}

document.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if (!el || !el.dataset.act) return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset, el, e);
});
document.addEventListener('change', e=>{ const el = e.target.closest('[data-chg]'); if (el && CHG[el.dataset.chg]) CHG[el.dataset.chg](el, e); });
document.addEventListener('input', e=>{
  if (e.target.dataset.inp === 'pname' && S.styleDraft){ S.styleDraft.name = e.target.value.slice(0,20); const bar = $('.savebar'); if (bar && !bar.querySelector('[data-act=styleSave]')) render(); }
});
document.addEventListener('keydown', e=>{
  if (S.modal && S.modal.type === 'pin'){ if (/^\d$/.test(e.key)) pinKey(e.key); else if (e.key === 'Backspace') pinKey('del'); }
  if (e.key === 'Escape' && S.modal) closeModal();
});
$('#filepick').addEventListener('change', e=>{ const f = e.target.files && e.target.files[0]; if (f) importFile(f); });
document.addEventListener('visibilitychange', async ()=>{
  if (document.visibilityState === 'visible' && S.dir && S.dirStatus === 'granted' && !S.modal && !S.testMode){ try { await syncFromFolder(); } catch {} }
});
document.addEventListener('visibilitychange', async ()=>{
  if (document.visibilityState === 'visible' && S.meta.jsonBinId && !S.modal && !S.testMode){
    try { if (await syncJsonBin()) toast('Recovered progress from an earlier JSONBin save and repaired the bin.'); }
    catch (e){ console.error(e); toast(`JSONBin sync failed: ${e.message}`); render(); }
  }
});

/* ================= boot ================= */
async function boot(){
  buildCatalog(parseListNames(WORD_LIST_TEXT));
  if (location.hash === '#selftest') return selfTest();
  if (location.hash.startsWith('#shot:')) return demoShot(location.hash.slice(6).split(':'));
  const raw = await kvGet('doc');
  try { S.doc = raw ? normalizeDoc(raw) : newDoc(); } catch { S.doc = newDoc(); }
  S.meta = (await kvGet('meta')) || {};
  if ('showDirectoryPicker' in window){
    const h = await kvGet('dir');
    if (h && h.queryPermission){
      S.dir = h;
      try { S.dirStatus = await h.queryPermission({mode:'readwrite'}); } catch { S.dirStatus = 'prompt'; }
    }
  }
  applyTheme(D().player); render();
  if (S.dirStatus === 'granted'){ try { await syncFromFolder(); } catch (e){ console.error(e); } }
  else if (!raw && !S.meta.jsonBinId) await persist();
  if (S.meta.jsonBinId){
    try { if (await syncJsonBin()) toast('Recovered progress from an earlier JSONBin save and repaired the bin.'); }
    catch (e){ console.error(e); toast(`JSONBin sync failed: ${e.message}`); render(); }
  } else S.remoteSyncReady = true;
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
}

// Renders a screen with sample data for visual checks; never touches saved progress.
async function demoShot([screen, th, mode]){
  S.testMode = true; S.doc = newDoc();
  Object.assign(D().player, {theme:th||'city', mode:mode||'day', name:'Alex', mainColor: ({space:'purple', castle:'red', chess:'black', diving:'teal'})[th] || 'blue', accentColor: ({castle:'yellow', chess:'yellow', diving:'orange'})[th] || 'orange'});
  D().settings.beeDate = addDays(todayKey(), 42);
  const ago = n => new Date(keyToDate(addDays(todayKey(), -n)).setHours(17)).toISOString();
  const snsb = ZONE_BY_ID.snsb.sets, list1 = ZONE_BY_ID.list1.sets;
  [...snsb.slice(0,6), ...list1.slice(0,9)].forEach((s,i)=>{ D().sets[s.name] = {studied:[ago(14-i % 12)], quizzes: i%3 ? [{date:ago(13-i % 12), score: 70 + (i*7)%31}] : []}; });
  D().sets[snsb[0].name].quizzes = [{date:ago(12), score:90}, {date:ago(2), score:95}];
  D().sets[list1[10].name] = {studied:[nowIso()], quizzes:[]};
  applyTheme(D().player);
  if (screen === 'zone'){ S.zoneId = 'snsb'; S.screen = 'zone'; }
  else if (screen === 'set'){ S.screen = 'today'; S.modal = {type:'set', id:snsb[1].id}; }
  else if (screen === 'celebrate'){ S.screen = 'today'; const b = computeStats(D()); D().sets[list1[11].name] = {studied:[nowIso()], quizzes:[]}; S.modal = {type:'celebrate', kind:'study', name:list1[11].name, studs:35, goalHit:true, streak:3}; }
  else S.screen = screen;
  if (screen === 'calendar') S.calDay = addDays(todayKey(), -3);
  if (screen === 'style') S.styleDraft = clone(D().player);
  render();
}
async function selfTest(){
  const out = [], ok = (c,m) => out.push((c ? 'PASS ' : 'FAIL ') + m);
  S.testMode = true; S.doc = newDoc(); applyTheme(D().player);
  try {
    ok(SETS.length >= 450, 'catalog sets: ' + SETS.length);
    ok(ZONES.length >= 20, 'zones: ' + ZONES.length + ' -> ' + ZONES.map(z=>`${z.id}(${z.sets.length})`).join(', '));
    const unmapped = SETS.filter(s=>s.zoneId.startsWith('z-'));
    ok(unmapped.length === 0, 'unmapped sets: ' + unmapped.map(s=>s.name).join(' | '));
    ok(SET_BY_NAME['Past National Scripps Words_Module 2631 words_set_33_set 33']?.zoneId === 'national', 'mixed-case national set mapped');
    ok(SET_BY_NAME['Greek  Roots']?.zoneId === 'roots' && SET_BY_NAME['New Latin  Roots 2']?.zoneId === 'roots', 'roots mapped: ' + SET_BY_NAME['New Latin  Roots 2']?.display);
    ok(SET_BY_NAME['Popular National Words_Set_06']?.zoneId === 'popular' && SET_BY_NAME['Popular National Words - Set 01']?.zoneId === 'popular', 'popular both formats');
    ok(SET_BY_NAME['Spelling Word List 6_Set_22']?.zoneId === 'list6', 'list 6 both formats');
    ok(SET_BY_NAME['Past SNSB Words_Set_03_2024']?.display === '2024', 'display label year');
    ok(SET_BY_NAME['Geographical Words Module_Set_05']?.display === 'Set 5', 'display label set number');
    ok(SET_BY_NAME['Intermediate Coaching - HW-Week2']?.zoneId === 'coach', 'coaching mapped');
    const s1 = ZONES[0].sets[0].name;
    await markStudied(s1);
    ok(setStatus(D().sets[s1]) === 'studied', 'studied state');
    ok(S.doc.versions.length === 1 && S.doc.versions[0].label === 'New game', 'first change creates 1 version');
    ok(S.modal && S.modal.type === 'celebrate' && S.modal.studs === 10, 'celebration shows +10 studs');
    await markQuiz(s1, 90);
    ok(setStatus(D().sets[s1]) === 'passed', 'passed state');
    ok(computeStats(D()).studs === 40, 'studs after study+quiz = 40: ' + computeStats(D()).studs);
    await markStudied(s1);
    ok(computeStats(D()).studs === 40, 'repeat same-day study earns no extra studs');
    await markStudied(ZONES[0].sets[1].name);
    ok(S.modal.goalHit === true && computeStats(D()).studs === 40+10+25, 'daily goal bonus: ' + computeStats(D()).studs);
    for (let i=0;i<12;i++) await markStudied(SETS[i+20].name);
    ok(S.doc.versions.length === 10, 'versions capped at 10: ' + S.doc.versions.length);
    const before = computeStats(D()).started;
    await undoLast();
    ok(computeStats(D()).started === before - 1, 'undo removes last set');
    ok(D().label.startsWith('Undo:') && S.doc.versions.length === 10, 'undo is itself versioned');
    await undoLast();
    ok(computeStats(D()).started === before, 'undo the undo brings it back');
    const target = clone(S.doc.versions[9]);
    await restoreVersion(9);
    ok(D().label.startsWith('Restored') && JSON.stringify(D().sets) === JSON.stringify(target.sets), 'restore oldest version');
    const g = {studied:[], quizzes:[{date:'2026-01-01T15:00:00Z',score:85},{date:'2026-01-09T15:00:00Z',score:90}]};
    ok(setStatus(g) === 'gold', 'gold after 8 days');
    ok(setStatus({studied:[], quizzes:[{date:'2026-01-01T15:00:00Z',score:85},{date:'2026-01-03T15:00:00Z',score:95}]}) === 'passed', 'no gold after 2 days');
    ok(setStatus({studied:[], quizzes:[{date:'2026-01-01T15:00:00Z',score:60}]}) === 'studied', 'failed quiz = studied');
    const rt = normalizeDoc(JSON.stringify(S.doc));
    ok(rt.versions.length === S.doc.versions.length && rt.current.savedAt === D().savedAt && JSON.stringify(rt.current.sets) === JSON.stringify(D().sets), 'JSON round trip');
    const brokenBin = clone(S.doc); brokenBin.current = {...brokenBin.current}; delete brokenBin.current.sets;
    brokenBin.versions = [clone(D()), ...brokenBin.versions];
    const recoveredBin = normalizeJsonBinDoc(brokenBin);
    ok(recoveredBin.recovered && JSON.stringify(recoveredBin.doc.current.sets) === JSON.stringify(D().sets), 'JSONBin recovers a malformed latest version from history');
    ok(normalizeDoc({...clone(S.doc), app:'BrickQuest'}).app === 'SpellCoach', 'accepts save files from before the rename');
    let rej = false; try { normalizeDoc('{"x":1}'); } catch { rej = true; } ok(rej, 'rejects non-save file');
    rej = false; try { normalizeDoc(JSON.stringify({...S.doc, schemaVersion:99})); } catch { rej = true; } ok(rej, 'rejects newer schema');
    const old = clone(S.doc); old.current.savedAt = '2020-01-01T00:00:00.000Z';
    ok(normalizeDoc(old).current.savedAt < D().savedAt, 'older-file detection works');
    const verBefore = S.doc.versions.length, cur = D().label;
    await adoptDoc(normalizeDoc(old), 'Opened save file');
    ok(S.doc.versions[0].label === cur && S.doc.versions.length === Math.min(MAX_VERSIONS, Math.max(verBefore, 1)), 'loading a file keeps current as a version');
    const y = {...D(), sets:{}}; const k = todayKey();
    y.sets[s1] = {studied:[new Date(keyToDate(addDays(k,-1)).setHours(10)).toISOString(), new Date(keyToDate(addDays(k,-2)).setHours(10)).toISOString(), nowIso()], quizzes:[]};
    ok(computeStats(y).streak === 3, 'streak counts 3 days: ' + computeStats(y).streak);
    for (const sc of ['today','map','calendar','style','parents']){ S.parentOk = true; S.screen = sc; S.modal = null; render(); }
    S.zoneId = 'snsb'; S.screen = 'zone'; render(); ok(document.querySelectorAll('.tile').length === ZONE_BY_ID.snsb.sets.length, 'zone screen renders tiles');
    const missing = ZONES.flatMap(z=>Object.keys(THEMES).filter(t=>!z.names[t] || !z.icons[t]).map(t=>z.id+':'+t));
    ok(missing.length === 0, 'every zone named in every theme: ' + missing.join(','));
    for (const t of Object.keys(THEMES)) for (const md of ['day','night']){ applyTheme({...D().player, theme:t, mode:md}); render(); }
    S.modal = {type:'set', id:SETS[0].id}; render(); ok(!!document.querySelector('.ladder'), 'set sheet renders');
    S.editMode = true; render(); ok(!!document.querySelector('.editbox'), 'edit mode renders');
    S.modal = {type:'quiz', id:SETS[0].id}; render(); ok(document.querySelectorAll('.scores .brick').length === 6, 'quiz sheet renders');
    S.modal = {type:'pin'}; render(); ok(document.querySelectorAll('.pinpad .brick').length === 11, 'pin pad renders');
  } catch (e){ ok(false, 'exception: ' + e.stack); }
  const pre = document.createElement('pre'); pre.id = 'selftest'; pre.textContent = out.join('\n'); document.body.prepend(pre);
  document.title = out.some(l=>l.startsWith('FAIL')) ? 'SELFTEST FAIL' : 'SELFTEST PASS';
}

boot().catch(e=>{ console.error(e); $('#app').innerHTML = `<div class="wrap" style="padding-top:40px"><h2>Something went wrong</h2><p>${esc(e.message)}</p></div>`; });
</script>
